---
java_app_name: "java-app"
java_app_version: "latest"
java_app_user_name: "java-app-user"
java_app_home_dir: "/opt/{{ java_app_name }}"
java_app_port: "8080"
java_app_xmx: "512m"
java_app_xms: "256m"
java_app_config_server_url: "http://127.0.0.1:8010"
java_app_config_server_profile: "default"
java_app_wait_for_port_open: true
java_app_wait_for_port_timeout: "60"

java_app_artifact_source: "local" # local/artifactory supported

java_app_artifact_local_path: "../artifacts/{{ java_app_name }}.jar"

java_app_artifactory_url: "https://artifactory"
java_app_artifactory_repo_name: "libs-snapshot-local"
java_app_artifactory_group_id: "com.org.app"
java_app_artifactory_user: "user"
java_app_artifactory_password: "password"
